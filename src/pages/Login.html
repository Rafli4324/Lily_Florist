<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lily Florist - Sign In</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mauve: '#A57172', 
            'mauve-dark': '#8c6d6e',
          },
          fontFamily: {
            'serif-display': ["'Playfair Display'", 'serif'],
            'poppins': ['Poppins', 'sans-serif']
          },
        }
      }
    }

    const supabaseUrl = 'https://uorxpavndirbgapqzugn.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvcnhwYXZuZGlyYmdhcHF6dWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNDAxOTQsImV4cCI6MjA3OTYxNjE5NH0.ebEFOmTgUFwOefA9FvVAxmm9jcTDVLDi5OLx_3_wh8k';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function handleLogin(event) {
      event.preventDefault();

      const email = document.querySelector('input[name="email"]').value;
      const password = document.querySelector('input[name="password"]').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          alert('Login gagal: ' + error.message);
        } else {
          alert('Login berhasil! Selamat datang.');
          window.location.href = 'dashboardadmin.html';
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Terjadi kesalahan. Coba lagi.');
      }
    }

    async function handleSignUp(event) {
      event.preventDefault();
      const email = document.querySelector('input[name="email"]').value;
      const password = document.querySelector('input[name="password"]').value;

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
        });

        if (error) {
          alert('Sign-up gagal: ' + error.message);
        } else {
          alert('Sign-up berhasil! Periksa email Anda untuk konfirmasi.');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Terjadi kesalahan. Coba lagi.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      form.addEventListener('submit', handleLogin);

    });
  </script>
</head>

<body class="font-poppins min-h-screen w-full md:h-screen md:overflow-hidden bg-white">

  <div class="flex flex-col md:flex-row min-h-screen md:h-screen">

      <div class="w-full h-48 md:h-full md:w-3/5 relative bg-cover bg-center bg-no-repeat" style="background-image: url('../img/login.png');">
          <div class="absolute inset-0 bg-[rgba(242,222,222,0.55)]"></div>
      </div>

      <div class="w-full md:w-2/5 bg-white -mt-10 md:mt-0 rounded-t-[40px] md:rounded-t-none md:rounded-l-[60px] relative z-10 shadow-2xl flex flex-col justify-center px-8 md:px-16 lg:px-20 py-12 md:py-0">

          <div class="mb-8 md:mb-10">
              <h1 class="font-serif-display text-4xl md:text-5xl text-mauve-dark mb-2">Lily Florist</h1>
              <h2 class="text-lg md:text-xl font-bold text-mauve">Sign In</h2>
          </div>

          <form action="#" method="post" class="space-y-6 md:space-y-8">
              
              <div class="group">
                  <label class="block text-xs text-gray-400 mb-1">Masukkan Email</label>
                  <input
                      type="email"
                      name="email"
                      class="w-full border-b border-gray-200 py-2 text-gray-700 focus:border-mauve focus:outline-none transition-colors bg-transparent placeholder-transparent"
                      required
                  />
              </div>

              <div class="group">
                  <label class="block text-xs text-gray-400 mb-1">Masukkan Kata Sandi</label>
                  <input
                      type="password"
                      name="password"
                      class="w-full border-b border-gray-200 py-2 text-gray-700 focus:border-mauve focus:outline-none transition-colors bg-transparent placeholder-transparent"
                      required
                  />
              </div>

              <div class="pt-4 md:pt-6">
                  <button 
                      type="submit" 
                      class="w-full rounded-xl bg-mauve py-3 text-white font-semibold shadow-md hover:bg-mauve-dark transition duration-300"
                  >
                      Masuk
                  </button>
              </div>
          </form>

      </div>
  </div>

</body>
</html>
